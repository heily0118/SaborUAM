<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - SaborUAM</title>
    <link rel="stylesheet" href="css/menu.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <header class="header">
        <div class="titulo-header">
            <h1>SaborUAM</h1>
        </div>

        <div class="acciones-header">
            <div id="btn-notificaciones" class="campana-container">
                <i data-lucide="bell" class="icono"></i>
                <span id="contador-notificaciones" class="contador-notificaciones" style="display:none;"></span>
                <div id="lista-notificaciones" class="panel-notificaciones">
                    </div>
            </div>
            
            <button id="btn-cerrar" class="btn-cerrar">Cerrar sesión</button>
        </div>
    </header>


    <main class="contenedor">

        <aside class="barra-filtro">
            <h2 class="menu-titulo">Menú</h2>
            <ul>
                <li><button class="filtro-btn activo" data-tipo="Todos">Todos</button></li>
                <li><button class="filtro-btn" data-tipo="Desayunos">Desayunos</button></li>
                <li><button class="filtro-btn" data-tipo="Almuerzos">Almuerzos</button></li>
                <li><button class="filtro-btn" data-tipo="Bebidas">Bebidas</button></li>
                <li><button class="filtro-btn" data-tipo="Otros">Otros</button></li>
            </ul>
        </aside>

        <section class="zona-principal">
            <div class="buscador">
                <input type="text" class="buscador-input" placeholder="Buscar producto...">
                <button><i data-lucide="search"></i></button>
            </div>

            <div class="productos" id="lista-productos"></div>

        </section>
    </main>

    <script src="js/menu.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
