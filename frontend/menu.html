<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu - SaborUAM</title>
  <link rel="stylesheet" href="css/menu.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- ENCABEZADO -->
  <header class="header">
    <div class="titulo">
      <h1>SaborUAM</h1>
    </div>

    <div class="acciones-header">
     <div class="notificaciones">
  <i data-lucide="bell" id="iconoNotificacion" class="icono-notificacion"></i>
  <span id="contadorNotificaciones" class="contador-notificacion">0</span>
  <div class="panel-notificaciones" id="panelNotificaciones">
    <h4>Notificaciones</h4>
    <ul id="listaNotificaciones"></ul>
  </div>
</div>

      <button id="btn-cerrar" class="btn-cerrar">Cerrar sesión</button>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="contenedor">

    <!-- BARRA LATERAL -->
    <aside class="barra-filtro">
      <h2>Menú</h2>
      <ul>
        <li><button class="filtro-btn activo">Todos</button></li>
        <li><button class="filtro-btn">Desayunos</button></li>
        <li><button class="filtro-btn">Almuerzos</button></li>
        <li><button class="filtro-btn">Bebidas</button></li>
        <li><button class="filtro-btn">Otros</button></li>
      </ul>
    </aside>

    <!-- ZONA PRINCIPAL -->
    <section class="zona-principal">
      <div class="buscador">
        <input type="text" placeholder="Buscar producto...">
        <button><i data-lucide="search"></i></button>
      </div>

      <!-- TARJETAS DE PRODUCTOS -->
      <div class="productos" id="lista-productos"></div>

    </section>
  </main>

  <script src="js/menu.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
